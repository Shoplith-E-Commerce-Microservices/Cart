spring:
  application:
    name: carts

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: cart-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.shoplith.carts.events.CartCreateEvent

  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:postgresql://localhost:5432/shoplith_carts
    username: postgres
    password: vyrazu
    driver-class-name: org.postgresql.Driver
  output:
    ansi:
      enabled: ALWAYS
  devtools:
    restart:
      enabled: true

server:
  port: 8003

